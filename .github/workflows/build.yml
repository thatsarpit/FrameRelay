name: macOS checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependency
        run: brew list ffmpeg >/dev/null 2>&1 || brew install ffmpeg
      - name: Build receiver
        run: bash scripts/build.sh
      - name: Compile camera extension (not activation)
        run: bash scripts/check-extension.sh
      - name: Validate configuration and real receiver flow
        run: bash scripts/test.sh
